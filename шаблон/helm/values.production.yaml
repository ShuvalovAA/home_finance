image: cr.yandex/crp0civq107m91j8p8a2/services/changeset
deployment: staging
replicaCount: 1

app:
  root: /services/changeset
  version: beta
  log_level: debug
  delay: 0

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

clickhouse:
  host: changeset-clickhouse
  port: 9000
  db:
    name: default
  user:
    name: clickhouse
    password: clickhouse

redis:
  version: 7.0
  port: 6379
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

postgresql:
  host: changeset-postgresql
  port: 5432
  db:
    name: postgres
  user:
    name: postgres
    password: postgres


autoscaling:
  enabled: false

sentry:
  enabled: false

statsd:
  enabled: false
