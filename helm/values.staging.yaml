image: 838375350179/hf
deployment: staging
replicaCount: 1

app:
  name: hfin
  root: dev.hfin.local
  version: latest
  log_level: debug
  delay: 0
  devhost: dev.hfin.local

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

clickhouse:
  host: hfin-clickhouse
  port: 9000
  db:
    name: default
  user:
    name: default
    password: ''

clickhouse_replica:
  host: hfin-clickhouse-replica
  port: 9000
  db:
    name: default
  user:
    name: default
    password: ''


redis:
  version: 7.0
  host: hfin-redis
  port: 6379
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

redis_cache:
  version: 7.0
  host: hfin-redis-cache
  port: 6379
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

postgresql:
  version: 15
  host: hfin-postgresql-master
  port: 5432
  db:
    name: postgres
  user:
    name: postgres
    password: postgres

postgresql_replica_1:
  version: 15
  host: hfin-postgresql-replica-1
  port: 5432
  db:
    name: postgres
  user:
    name: postgres
    password: postgres

postgresql_replica_2:
  version: 15
  host: hfin-postgresql-replica-2
  port: 5432
  db:
    name: postgres
  user:
    name: postgres
    password: postgres

autoscaling:
  enabled: false

sentry:
  enabled: false

statsd:
  enabled: false

elastic_search:
  host: hfin-elastic-search
  port: 9200
  forward_port: 21645

kibana:
  host: hfin-kibana

logstash:
  host: hfin-logstash
  port: 5044

filebeat:
  host: hfin-filebeat
