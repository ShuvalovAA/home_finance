---
{{- if ne .Values.deployment "production" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "service.fullname" . }}-celery-worker
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "service.name" . }}-{{ .Values.deployment | default "dev" }}-celery-worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "service.name" . }}-{{ .Values.deployment | default "dev" }}-celery-worker
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      initContainers:
        - name: {{ .Chart.Name }}-init-redis
          image: busybox:1.35
          {{- if eq .Values.deployment "local" }}
          imagePullPolicy: IfNotPresent
          {{- else }}
          imagePullPolicy: Always
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "service.fullname" . }}-app-env
          command: ['sh', '-c', 'echo -e "Checking Redis"; while ! nc -z $(HFIN_REDIS_HOST) $(HFIN_REDIS_PORT); do sleep 1; printf "-"; done; echo -e "  >> Redis OK";']
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image }}:{{ .Values.app.version | default .Chart.AppVersion }}"
          {{- if eq .Values.deployment "local" }}
          imagePullPolicy: IfNotPresent
          {{- else }}
          imagePullPolicy: Always
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "service.fullname" . }}-app-env
          command:
            - "poetry"
          args:
            - "run"
            - "celery"
            - "-A"
            - "celery_app.CELERY_APP"
            - "worker"
            - "--loglevel=INFO"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
{{- end }}
