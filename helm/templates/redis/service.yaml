{{- if ne .Values.deployment "production" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "service.fullname" . }}-redis
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "service.name" . }}-{{ .Values.deployment | default "dev" }}-redis
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: {{ include "service.fullname" . }}-redis
      port: {{ .Values.redis.port }}
      targetPort: {{ .Values.redis.port }}
{{- end }}
