---
{{- if ne .Values.deployment "production" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "service.fullname" . }}-postgresql-replica-2
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - protocol: TCP
      port: {{ .Values.postgresql_replica_2.port }}
      targetPort: {{ .Values.postgresql_replica_2.port }}
  selector:
    app.kubernetes.io/name: {{ .Values.postgresql_replica_2.host }}
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
