---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: es-logging
  name: {{ include "service.fullname" . }}-elastic-search
  namespace: hfin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: es-logging
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: es-logging
    spec:
      containers:
      - image: elasticsearch:7.8.0
        imagePullPolicy: IfNotPresent
        name: elasticsearch
        env:
        - name: XPACK_SECURITY_ENABLED
          value: "false"
        env:
        - name: DEMO_GREETING
          value: "Hello from the environment"
        ports:
        - containerPort: 9200
          name: http
          protocol: TCP
        - containerPort: 9300
          name: transport
          protocol: TCP
        env:
        - name: discovery.type
          value: single-node
        volumeMounts:
        - name: elasticsearch-logging
          mountPath: /data
        # - name: elastic-search-configmap
        #   mountPath: /usr/share/elasticsearch/config
      volumes:
      - name: elasticsearch-logging
        emptyDir: {}
      # - name: elastic-search-configmap
      #   configMap:
      #     name: elastic-search-configmap