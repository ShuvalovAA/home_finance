apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "service.fullname" . }}-filebeat
  namespace: hfin
  labels:
    k8s-app: filebeat
spec:
  selector:
    matchLabels:
      k8s-app: filebeat
  template:
    metadata:
      labels:
        k8s-app: filebeat
    spec:
      containers:
        - name: filebeat
          image: elastic/filebeat:8.15.3
          args: [
            "-c", "/etc/filebeat.yml",
            "-e",
          ]
          securityContext:
            runAsUser: 0
          resources:
            limits:
              memory: 200Mi
            requests:
              cpu: 100m
              memory: 100Mi
          volumeMounts:
            - name: filebeat-config
              mountPath: /etc/filebeat.yml
              subPath: filebeat.yml
            - name: data
              mountPath: /usr/share/filebeat/data
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
            - name: varlog
              mountPath: /var/log
            - name: nginx-logs
              mountPath: /var/log/nginx
            # - name: filebeat-config
            #   mountPath: /usr/share/filebeat/filebeat.yml
      volumes:
        - name: filebeat-config
          configMap:
            name: filebeat-config
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        - name: varlog
          hostPath:
            path: /var/log
        - name: data
          hostPath:
            path: /var/lib/filebeat-data
            type: DirectoryOrCreate
        - name: nginx-logs
          persistentVolumeClaim:
            claimName: {{ include "service.fullname" . }}-nginx-pvc