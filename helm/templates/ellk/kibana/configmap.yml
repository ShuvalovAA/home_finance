apiVersion: v1
kind: ConfigMap
metadata:
  name: kibana-configmap
  namespace: hfin
  labels:
    k8s-app: kibana
data:
  kibana.yml: |-
    server.name: kibana
    server.host: "0"
    xpack.monitoring.ui.container.elasticsearch.enabled: false
    elasticsearch.requestTimeout: 90000
    elasticsearch.hosts: [ "http://{{ .Values.elastic_search.host }}:{{ .Values.elastic_search.port }}" ]