---
{{- if ne .Values.deployment "production" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "service.fullname" . }}-redis-cache
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "service.name" . }}-{{ .Values.deployment | default "dev" }}-redis-cache
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "service.name" . }}-{{ .Values.deployment | default "dev" }}-redis-cache
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ include "service.fullname" . }}-redis-cache
          image: redis:{{ .Values.redis_cache.version | default "7.2.3" }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.redis_cache.port }}
          resources:
            {{- toYaml .Values.redis_cache.resources | nindent 12 }}
{{- end }}
