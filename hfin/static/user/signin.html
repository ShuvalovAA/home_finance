{% load static %}


<!DOCTYPE html>
<html lang="ru" dir="ltr">
  <head>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js">
	</script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>SigIn Form | Home Finance</title> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css"/>
	<link rel="shortcut icon" href="{% static 'common/images/favicon.ico' %}">
  </head>
  <body>
    <div class="container">
      <div class="wrapper">
        <div class="title"><span><img src=" {%  static 'common/images/logo.png' %}"></span></div>
        <form method="POST" novalidate class="signin">
			{% csrf_token %}
		  
			{% for field in form %}
				<div class="row">
					{% if field.name == 'phone' %}
						<i class="fas fa-user"></i>
					{% else %}
					<i class="fas fa-lock"></i>
					{% endif %}
				{{ field }}
				</div>
			{% endfor %}
          <div class="row button">
            <input type="submit" value="Login">
          </div>
		  <div class="pass"><a href="#">Forgot password?</a></div>
		  <div class="signup-link">Don't have an account? <a href="{%url 'register' %}">SignUp</a></div>
        </form>
      </div>
    </div>
  </body>
</html>


<script>
	$('.captcha').click(function (){
		$.getJSON("/captcha/refresh/", function (result) {
			$('.captcha').attr('src', result['image_url']);
			$('#id_captcha_0').val(result['key'])
		});
	});
</script>

<style>
	@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700&display=swap');
	*{
	  margin: 0;
	  padding: 0;
	  box-sizing: border-box;
	  font-family: 'Poppins',sans-serif;
	}
	body{
	  background: #ffc15385;
	  overflow: hidden;
	}
	::selection{
	  background: rgba(26,188,156,0.3);
	}
	.container{
	  max-width: 440px;
	  padding: 0 20px;
	  margin: 170px auto;
	}
	.wrapper{
	  width: 100%;
	  background: #fff;
	  border-radius: 5px;
	  box-shadow: 0px 4px 10px 1px rgba(0,0,0,0.1);
	}
	.wrapper .title{
	  height: 120px;
	  background: #ffc153;
	  border-radius: 5px 5px 0 0;
	  color: #fff;
	  font-size: 30px;
	  font-weight: 600;
	  display: flex;
	  align-items: center;
	  justify-content: center;
	}
	.wrapper form{
	  padding: 30px 25px 25px 25px;
	}
	.wrapper form .row{
	  height: 45px;
	  margin-bottom: 15px;
	  position: relative;
	}
	.wrapper form .row input{
	  height: 100%;
	  width: 100%;
	  outline: none;
	  padding-left: 60px;
	  border-radius: 5px;
	  border: 1px solid black;
	  font-size: 16px;
	  transition: all 0.3s ease;
	}
	.wrapper form .row input#id_captcha_1{
    padding: 1em;
    position: absolute;
    top: 50%;
    left: 79%;
    transform: translate(-50%, -50%);
    text-align: center;
    padding-block: inherit;
    padding-inline-start: 0px;
    height: 99%;
    width: 41.6%;
	}
	img.captcha{
		height: 100%;
		width: 40%;
		outline: none;
		padding-right: 0;
		border-radius: 5px;
		font-size: 16px;
		transition: all 0.3s ease;
		margin-left: 60px;
	}
	form .row input:focus{
	  border-color: #ffc153;
	  box-shadow: inset 0px 0px 2px 2px rgba(26,188,156,0.25);
	}
	form .row input::placeholder{
	  color: #999;
	}
	.wrapper form .row i{
	  position: absolute;
	  width: 47px;
	  height: 100%;
	  color: #fff;
	  font-size: 18px;
	  background: #ffc153;
	  border: 1px solid black;
	  border-radius: 5px 0 0 5px;
	  display: flex;
	  align-items: center;
	  justify-content: center;
	}
	.wrapper form .pass{
	  margin: -8px 0 20px 0;
	}
	.wrapper form .pass a{
	  color: #ffc153;
	  font-size: 17px;
	  text-decoration: none;
	}
	.wrapper form .pass a:hover{
	  text-decoration: underline;
	}
	.wrapper form .button input{
	  color: #fff;
	  font-size: 20px;
	  font-weight: 500;
	  padding-left: 0px;
	  background: #ffc153;
	  border: 1px solid #ffc153;
	  cursor: pointer;
	}
	form .button input:hover{
	  background: #ffc153;
	}
	.wrapper form .signup-link{
	  text-align: center;
	  margin-top: 20px;
	  font-size: 17px;
	}
	.wrapper form .signup-link a{
	  color: #ffc153;
	  text-decoration: none;
	}
	form .signup-link a:hover{
	  text-decoration: underline;
	}
	img {
		height: 100%;
		width: 65%;
		margin-left: auto;
		margin-right: auto;
	}
</style>
