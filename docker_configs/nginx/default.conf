upstream app {
    server django:8000;
}

server {
    listen 80;
    server_name home_f;
    large_client_header_buffers  8 32k;
    client_max_body_size 30m;

    location / {
        proxy_pass http://app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
    location /staticfiles/ {
        alias /var/www/html/staticfiles/;
    }
}