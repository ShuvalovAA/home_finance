version: '3.9'

services:
  django:
    build: ./
    #command: sh -c "gunicorn --reload --bind 0.0.0.0:8000 home_f.wsgi:application"
    command: sh -c "gunicorn --reload --bind 0.0.0.0:8000 home_f.wsgi:application"
    volumes:
      - ./:/src
      - static_data:/src/static
    expose:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://django:django_QWErty!2)4@bd:5432/django
      - DEBUG=1
    depends_on:
      - db
  db:
    image: postgres:9.6
    volumes:
      - pg_data:/var/lib/postgresql/data/
    expose:
      - 5432
    environment:
    - POSTGRES_USER=postgres
    - POSTGRES_PASSWORD=postgres
    - POSTGRES_DB=postgres
  nginx:
    hostname: home_f
    image: nginx:1.19.8-alpine
    ports:
      - "80:80"
    volumes:
      - static_data:/var/www/html/static
      - ./docker_configs/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - django
volumes:
 pg_data:
 static_data: